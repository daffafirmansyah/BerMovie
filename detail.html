<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Detail - BerMovie</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

<link rel="stylesheet" href="modern.css?v=8">
<style>

</style>
    <style>
        .detail-page { padding-top: var(--nav-height); }
        .detail-hero {
            width: 100%; height: 50vh; min-height: 350px;
            background-size: cover; background-position: center 20%;
            position: relative;
        }
        .detail-cast::-webkit-scrollbar { height: 2px; }
        .detail-cast-item { flex: 0 0 70px; text-align: center; }
        .detail-cast-item img {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
            margin-bottom: 6px; background: #1a1a2e;
            border: 2px solid rgba(255,255,255,0.06);
        }
        .detail-cast-item p {
            font-size: 0.7rem; color: var(--text3);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .detail-loading {
            padding-top: calc(var(--nav-height) + 80px);
            text-align: center; color: var(--text3);
        }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(0,0,0,0.6); color: white; font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; transition: all 0.2s;
            pointer-events: auto;
        }
        .back-btn:hover { background: var(--accent); }
        @media (max-width: 768px) {
            .detail-hero { height: 35vh; min-height: 250px; }
            .detail-body { padding: 0 12px 40px; margin-top: -40px; }
            .back-btn { top: 12px; left: 12px; width: 36px; height: 36px; font-size: 1rem; }
        }
        .seasons-list {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;
        }
        .season-card {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            background: rgba(255,255,255,0.04); border-radius: 10px;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .season-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); }
        .season-card img { width: 36px; height: 54px; border-radius: 4px; object-fit: cover; }
        .season-card .info { font-size: 0.82rem; }
        .season-card .info strong { display: block; }
        .season-card .info small { color: var(--text3); }
        .section-title-sm { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; margin-top: 24px; }
    </style>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="./" class="logo">BerMovie</a>
            <div class="nav-search">
                <input type="text" id="searchInput" data-i18n="search" placeholder="Cari film atau series..." autocomplete="off">
                <button id="searchBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
            </div>
            <div class="nav-links">
                <a href="./" class="active" data-nav="home">Home</a>
                <a href="movies.html" data-nav="movies" data-i18n="nav_movies">Film</a>
                <a href="tv.html" data-nav="tv" data-i18n="nav_tv">Serial</a>
                <div class="nav-dropdown">
                    <span class="nav-dropdown-trigger" data-nav="genre" data-i18n="nav_genre">Genre<svg class="nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;display:inline-block;vertical-align:middle;margin-left:2px"><polyline points="6 9 12 15 18 9"/></svg></span>
                    <div class="dropdown-menu" id="genreDropdown"></div>
                </div>
                <div class="nav-dropdown">
                    <span class="nav-dropdown-trigger" data-nav="country" data-i18n="nav_country">Negara<svg class="nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;display:inline-block;vertical-align:middle;margin-left:2px"><polyline points="6 9 12 15 18 9"/></svg></span>
                    <div class="dropdown-menu" id="countryDropdown"></div>
                </div>
                <div class="nav-dropdown">
                    <span class="nav-dropdown-trigger" data-nav="tahun" data-i18n="nav_tahun">Tahun<svg class="nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;display:inline-block;vertical-align:middle;margin-left:2px"><polyline points="6 9 12 15 18 9"/></svg></span>
                    <div class="dropdown-menu" id="yearDropdown"></div>
                </div>
                <a href="./?watchlist" class="nav-fav" data-i18n="nav_favorit">Favorit</a>
                <button class="nav-lang-btn" id="langToggle" title="Switch language" onclick="toggleLanguage()">EN</button>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" style="cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="pointer-events:none"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        </div>
        <!-- Mobile Menu -->
        <div class="mobile-menu" id="mobileMenu">
            <div class="mobile-search">
                <input type="text" id="mobileSearchInput" data-i18n="search" placeholder="Cari film atau series..." autocomplete="off">
                <button id="mobileSearchBtn" data-i18n="search_btn">Cari</button>
            </div>
            <a href="./" data-nav="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span data-i18n="nav_home">Home</span></a>
            <a href="movies.html" data-nav="movies" data-i18n="nav_movies">Film</a>
            <a href="tv.html" data-nav="tv" data-i18n="nav_tv">Serial</a>
            <a href="genre.html" data-nav="genre"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span data-i18n="nav_genre">Genre</span></a>
            <a href="leaderboard.html" data-nav="leaderboard" data-i18n="nav_leaderboard">Peringkat</a>
            <a href="movies.html" data-nav="tahun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span data-i18n="nav_tahun">Tahun</span></a>
            <a href="movies.html" data-nav="country"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span data-i18n="nav_country">Negara</span></a>
            <a href="./?watchlist" data-nav="watchlist" data-i18n="nav_favorit">Favorit</a>
            <button class="nav-lang-btn" id="langToggleMobile" onclick="toggleLanguage()">EN</button>
        </div>
    </nav>


    <div class="detail-loading" id="detailLoading">Memuat...</div>

    <div class="detail-page hidden" id="detailPage">
        <div class="detail-hero" id="detailHero">
            <button class="back-btn" id="detailBackBtn">←</button>
        </div>
        <div class="detail-body">
            <h1 id="detailTitle"></h1>
            <div class="detail-meta" id="detailMeta"></div>
            <p class="detail-overview" id="detailOverview"></p>
            <div class="detail-actions">
                <button class="btn-watch" id="detailWatchBtn" data-i18n="watch_btn">Tonton</button>
                <button class="btn-secondary trailer-btn" id="detailTrailerBtn"><span class="t-il"></span><span class="t-txt" data-i18n="trailer_btn">Trailer</span><span class="t-ir"></span></button>
                <button class="btn-secondary fav-btn" id="detailFavBtn" title="Tambahkan ke favorit"><span class="fav-txt" data-i18n="fav_add">Tambah ke Favorit</span></button>

            </div>
            <!-- TRAILER SECTION -->
            <div class="trailer-section hidden" id="trailerSection">
                <div class="trailer-embed">
                    <iframe id="trailerIframe" allowfullscreen></iframe>
                </div>
            </div>
            <h3 class="section-title-sm" data-i18n="cast_title">Pemain</h3>
            <div class="detail-cast" id="detailCast"></div>
            <div class="seasons-section hidden" id="detailSeasons">
                <h3 class="section-title-sm" data-i18n="seasons_title">Musim</h3>
                <div class="seasons-list" id="detailSeasonsList"></div>
            </div>
            <h3 class="section-title-sm" data-i18n="recommend_title">Rekomendasi</h3>
            <div class="carousel" id="detailSimilar"></div>
        </div>
    </div>

    <!-- PLAYER MODAL -->
    <div class="player-modal hidden" id="playerModal">
        <div class="player-backdrop"></div>
        <div class="player-content">
            <div class="player-top">
                <button class="player-back" id="playerBackBtn">&larr;</button>
                <span class="player-title" id="playerTitle"></span>
                <div class="player-top-right">
                    <button class="player-eps-btn hidden" id="playerEpsBtn">&#9776;</button>
                    <button class="player-fs-btn" id="playerFsBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
                    <button class="player-close" id="playerCloseBtn">&times;</button>
                </div>
            </div>
            <div class="iframe-container">
                <iframe id="playerFrame" src="" frameborder="0" allowfullscreen></iframe>
                <div class="player-controls" id="playerControls">
                    <div class="player-servers" id="playerServers">
                        <button class="svr-btn active" data-server="vesy">Vesy <small>Auto</small></button>
                        <button class="svr-btn" data-server="videasy">Videasy <small>Fast</small></button>
                        <button class="svr-btn" data-server="vidnest">VidNest <small>HD</small></button>
                        <button class="svr-btn" data-server="vnest">VNest <small>Auto</small></button>
                        <button class="svr-btn" data-server="vidsrcsu">VidSrc <small>Multi</small></button>
                        <button class="svr-btn" data-server="apiplayer">ApiPlayer <small>Sub Indo</small></button>
                        <button class="svr-btn" data-server="2embed">2Embed <small>1080p</small></button>
                        <button class="svr-btn" data-server="vixsrc">VixSrc <small>HLS</small></button>
                    </div>
            </div>
            </div>
            <div class="episode-sheet hidden" id="episodeSheet">
                <div class="ep-sheet-handle"></div>
                <div class="ep-sheet-header">
                    <h4 data-i18n="episode_title">Episode</h4>
                    <button class="ep-sheet-close" id="epSheetClose">&times;</button>
                </div>
                <select id="seasonSelect" class="ep-season-select"></select>
                <div class="episodes-grid" id="episodesGrid"></div>
            </div>
        </div>
    </div>

    <script defer src="main.v17.js?v=33"></script>
    <script>
        // Parse URL params
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const type = urlParams.get('type') || 'movie';
        if (id) loadDetailPage(parseInt(id), type);
        else document.getElementById('detailLoading').textContent = (typeof t === 'function' ? t('id_not_found') : 'ID tidak ditemukan');
    </script>
</body>
</html>
